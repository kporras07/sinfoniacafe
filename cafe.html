<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café — Sinfonía Café</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .product-card {
      background-color: #f0e6cf;
      color: #3a4a1a;
    }

    .product-info h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
    }

    .product-details {
      font-size: 0.85rem;
      line-height: 1.7;
      opacity: 0.8;
      margin-bottom: 0.75rem;
    }

    .product-details span {
      display: block;
    }

    .product-details .label {
      opacity: 1;
      color: #637732;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .detail-row {
      display: flex;
      gap: 0.3rem;
      align-items: baseline;
    }

    .price-size {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
    }

    .price {
      font-size: 1.1rem;
    }

    .size {
      font-size: 0.85rem;
      color: #637732;
    }

    .product-actions {
      margin-top: auto;
    }

    .btn-primary {
      background-color: #637732;
      color: #f0e6cf;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <img src="images/logo.jpg" alt="Sinfonía Café">
    </a>
    <a href="/" class="site-title">Sinfonía Café</a>
    <nav class="nav-menu" id="nav">
      <a href="/">Inicio</a>
      <a href="cafe">Nuestros Cafés</a>
      <a href="preordenar">Preordenar</a>
      <a href="https://instagram.com/sinfonia_cafe_cr" target="_blank" rel="noopener">Instagram</a>
    </nav>
    <button class="hamburger" onclick="toggleNav()" aria-label="Menú">&#9776;</button>
  </header>

  <main>
    <h1>Nuestros Cafés</h1>
    <p class="subtitle">Café de especialidad tostado en Costa Rica</p>

    <div class="products" id="catalog"></div>
  </main>

  <script src="main.js"></script>
  <script>
    var coffees = [
      {
        name: 'Kenia Lavado',
        variedad: 'Kenia',
        region: 'Valle Occidental',
        productor: 'Toño Barrantes',
        altitud: '1550 msnm',
        proceso: 'Lavado',
        price: 6500,
        size: '250g'
      },
      {
        name: 'Kenia Natural',
        variedad: 'Kenia',
        region: 'Valle Occidental',
        productor: 'Toño Barrantes',
        altitud: '1550 msnm',
        proceso: 'Natural',
        price: 6500,
        size: '250g'
      },
      {
        name: 'Geisha',
        variedad: 'Geisha',
        region: 'Coto Brus',
        productor: 'Joselyn Fallas',
        altitud: '1200 msnm',
        proceso: 'Natural Fermentado Levadura',
        price: 7000,
        size: '250g'
      },
      {
        name: 'Milenio + Centroamericano',
        variedad: 'Milenio / Centroamericano',
        region: 'Valle Occidental',
        productor: 'Max Salazar',
        altitud: '1500 msnm',
        proceso: 'Anaeróbico Miel',
        price: 7000,
        size: '250g'
      },
      {
        name: 'Kenia + Geisha',
        variedad: 'Kenia / Geisha',
        region: 'Valle Occidental',
        productor: 'Max Salazar',
        altitud: '1700 msnm',
        proceso: 'Natural Reposado',
        price: 7000,
        size: '250g'
      },
      {
        name: 'Milenio',
        variedad: 'Milenio',
        region: 'Valle Occidental',
        productor: 'Max Salazar',
        altitud: '1600 msnm',
        proceso: 'Red Honey',
        price: 6500,
        size: '250g'
      },
      {
        name: 'Sarchimor',
        variedad: 'Sarchimor',
        region: 'Norte',
        productor: 'Luis Diego Santamaría',
        altitud: '1300 msnm',
        proceso: 'Maceración Carbónica',
        price: 10000,
        size: '200g'
      },
    ];

    (function() {
      var catalog = document.getElementById('catalog');

      coffees.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'product-card';

        var img = document.createElement('img');
        img.src = 'images/logo.jpg';
        img.alt = c.name;
        card.appendChild(img);

        var info = document.createElement('div');
        info.className = 'product-info';

        var h3 = document.createElement('h3');
        h3.textContent = c.name;
        info.appendChild(h3);

        var details = document.createElement('div');
        details.className = 'product-details';

        var fields = [
          ['Variedad', c.variedad],
          ['Región', c.region],
          ['Productor', c.productor],
          ['Altitud', c.altitud],
          ['Proceso', c.proceso],
        ];

        fields.forEach(function(f) {
          if (!f[1]) return;
          var row = document.createElement('div');
          row.className = 'detail-row';
          var label = document.createElement('span');
          label.className = 'label';
          label.textContent = f[0] + ':';
          var value = document.createElement('span');
          value.textContent = ' ' + f[1];
          row.appendChild(label);
          row.appendChild(value);
          details.appendChild(row);
        });

        info.appendChild(details);

        var priceSize = document.createElement('div');
        priceSize.className = 'price-size';
        var priceEl = document.createElement('span');
        priceEl.className = 'price';
        priceEl.textContent = formatPrice(c.price);
        var sizeEl = document.createElement('span');
        sizeEl.className = 'size';
        sizeEl.textContent = c.size;
        priceSize.appendChild(priceEl);
        priceSize.appendChild(sizeEl);
        info.appendChild(priceSize);

        var actions = document.createElement('div');
        actions.className = 'product-actions';
        var waLink = document.createElement('a');
        waLink.className = 'btn btn-primary';
        waLink.href = buildWhatsAppLink([{ name: c.name + ' (' + c.size + ')', price: c.price }]);
        waLink.target = '_blank';
        waLink.rel = 'noopener';
        waLink.textContent = 'Comprar';
        actions.appendChild(waLink);

        info.appendChild(actions);
        card.appendChild(info);
        catalog.appendChild(card);
      });
    })();
  </script>
</body>
</html>
