<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café — Sinfonía Café</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #637732;
      color: #f0e6cf;
      font-family: Georgia, 'Times New Roman', serif;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      background-color: #4a5a25;
      z-index: 10;
    }

    header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    header a {
      color: #f0e6cf;
      text-decoration: none;
      font-size: 1.25rem;
    }

    header .site-title {
      font-size: 1.5rem;
      font-style: italic;
      letter-spacing: 0.05em;
    }

    .hamburger {
      margin-left: auto;
      background: none;
      border: none;
      color: #f0e6cf;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }

    .nav-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: #4a5a25;
      padding: 0.5rem 2rem 1rem;
      flex-direction: column;
    }

    .nav-menu.open {
      display: flex;
    }

    .nav-menu a {
      color: #f0e6cf;
      text-decoration: none;
      padding: 0.6rem 0;
      font-size: 1rem;
      border-bottom: 1px solid rgba(240, 230, 207, 0.15);
    }

    .nav-menu a:last-child {
      border-bottom: none;
    }

    .nav-menu a:hover {
      opacity: 0.8;
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }

      .nav-menu {
        display: flex;
        position: static;
        flex-direction: row;
        gap: 2rem;
        background: none;
        padding: 0;
        margin-left: auto;
        align-items: center;
      }

      .nav-menu a {
        padding: 0.4rem 0;
        font-size: 1.05rem;
        border-bottom: 2px solid transparent;
        letter-spacing: 0.03em;
      }

      .nav-menu a:hover {
        border-bottom-color: #f0e6cf;
        opacity: 1;
      }
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 2rem 4rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      opacity: 0.75;
      font-style: italic;
      margin-bottom: 2.5rem;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background-color: #f0e6cf;
      color: #3a4a1a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background-color: rgba(240, 230, 207, 0.05);
    }

    .product-info {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-info h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .product-details {
      font-size: 0.85rem;
      line-height: 1.7;
      opacity: 0.8;
      margin-bottom: 0.75rem;
    }

    .product-details span {
      display: block;
    }

    .product-details .label {
      opacity: 1;
      color: #637732;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .detail-row {
      display: flex;
      gap: 0.3rem;
      align-items: baseline;
    }

    .price-size {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
    }

    .price {
      font-size: 1.1rem;
    }

    .size {
      font-size: 0.85rem;
      opacity: 1;
      color: #637732;
    }

    .product-actions {
      margin-top: auto;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: opacity 0.2s;
      width: 100%;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-primary {
      background-color: #637732;
      color: #f0e6cf;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <img src="images/logo.jpg" alt="Sinfonía Café">
    </a>
    <a href="/" class="site-title">Sinfonía Café</a>
    <nav class="nav-menu" id="nav">
      <a href="/">Inicio</a>
      <a href="cafe">Nuestros Cafés</a>
      <a href="preordenar">Preordenar</a>
      <a href="https://instagram.com/sinfonia_cafe_cr" target="_blank" rel="noopener">Instagram</a>
    </nav>
    <button class="hamburger" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="Menú">&#9776;</button>
  </header>

  <main>
    <h1>Nuestros Cafés</h1>
    <p class="subtitle">Café de especialidad tostado en Costa Rica</p>

    <div class="products" id="catalog"></div>
  </main>

  <script>
    var WA_NUMBER = ['\x35\x30\x36', '854', '892', '36'].join('');

    var coffees = [
      {
        name: 'Kenia Lavado Herbazú',
        variedad: 'Kenia',
        region: 'Valle Occidental',
        productor: 'Toño Barrantes',
        altitud: '1550 msnm',
        proceso: 'Lavado',
        price: 6500,
        size: '250g'
      },
      {
        name: 'Kenia Natural Herbazú',
        variedad: 'Kenia',
        region: 'Valle Occidental',
        productor: 'Toño Barrantes',
        altitud: '1550 msnm',
        proceso: 'Natural',
        price: 6500,
        size: '250g'
      },
      {
        name: 'Geisha Natural Fermentado Levadura',
        variedad: 'Geisha',
        region: 'Coto Brus',
        productor: 'Joselyn Fallas',
        altitud: '1200 msnm',
        proceso: 'Natural Fermentado Levadura',
        price: 7000,
        size: '250g'
      },
      {
        name: 'Milenio + Centroamericano',
        variedad: 'Milenio / Centroamericano',
        region: 'Valle Occidental',
        productor: 'Max Salazar',
        altitud: '1500 msnm',
        proceso: 'Anaeróbico Miel',
        price: 7000,
        size: '250g'
      },
      {
        name: 'Kenia + Geisha',
        variedad: 'Kenia / Geisha',
        region: 'Valle Occidental',
        productor: 'Max Salazar',
        altitud: '1700 msnm',
        proceso: 'Natural Reposado',
        price: 7000,
        size: '250g'
      },
      {
        name: 'Milenio Miel',
        variedad: 'Milenio',
        region: 'Valle Occidental',
        productor: 'Max Salazar',
        altitud: '1600 msnm',
        proceso: 'Red Honey',
        price: 6500,
        size: '250g'
      },
      {
        name: 'Sarchimor Maceración Carbónica',
        variedad: 'Sarchimor',
        region: 'Norte',
        productor: 'Luis Diego Santamaría',
        altitud: '1300 msnm',
        proceso: 'Maceración Carbónica',
        price: 10000,
        size: '200g'
      },
    ];

    function formatPrice(n) {
      return '₡' + n.toLocaleString('es-CR');
    }

    function buildWhatsAppLink(coffee) {
      var msg = 'Hola! Me interesa comprar:\n\n';
      msg += '• ' + coffee.name + ' (' + coffee.size + ') — ' + formatPrice(coffee.price);
      return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
    }

    function render() {
      var catalog = document.getElementById('catalog');

      coffees.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'product-card';

        var img = document.createElement('img');
        img.src = 'images/logo.jpg';
        img.alt = c.name;
        card.appendChild(img);

        var info = document.createElement('div');
        info.className = 'product-info';

        var h3 = document.createElement('h3');
        h3.textContent = c.name;
        info.appendChild(h3);

        var details = document.createElement('div');
        details.className = 'product-details';

        var fields = [
          ['Variedad', c.variedad],
          ['Región', c.region],
          ['Productor', c.productor],
          ['Altitud', c.altitud],
          ['Proceso', c.proceso],
        ];

        fields.forEach(function(f) {
          if (!f[1]) return;
          var row = document.createElement('div');
          row.className = 'detail-row';
          var label = document.createElement('span');
          label.className = 'label';
          label.textContent = f[0] + ':';
          var value = document.createElement('span');
          value.textContent = ' ' + f[1];
          row.appendChild(label);
          row.appendChild(value);
          details.appendChild(row);
        });

        info.appendChild(details);

        var priceSize = document.createElement('div');
        priceSize.className = 'price-size';
        var priceEl = document.createElement('span');
        priceEl.className = 'price';
        priceEl.textContent = formatPrice(c.price);
        var sizeEl = document.createElement('span');
        sizeEl.className = 'size';
        sizeEl.textContent = c.size;
        priceSize.appendChild(priceEl);
        priceSize.appendChild(sizeEl);
        info.appendChild(priceSize);

        var actions = document.createElement('div');
        actions.className = 'product-actions';
        var waLink = document.createElement('a');
        waLink.className = 'btn btn-primary';
        waLink.href = buildWhatsAppLink(c);
        waLink.target = '_blank';
        waLink.rel = 'noopener';
        waLink.textContent = 'Comprar';
        actions.appendChild(waLink);

        info.appendChild(actions);
        card.appendChild(info);
        catalog.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
