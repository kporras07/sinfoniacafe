<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinfonía Café</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }

    .logo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 2rem;
      border: 3px solid #f0e6cf;
    }

    .tagline {
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      font-style: italic;
      opacity: 0.85;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .nav-links a {
      display: inline-block;
      color: #637732;
      background-color: #f0e6cf;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 4px;
      font-size: 1rem;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/logo.jpg" alt="Sinfonía Café" class="logo">
    <p class="tagline">Café de especialidad de Costa Rica</p>
    <div class="nav-links">
      <a href="cafe">Nuestros Cafés</a>
      <a href="preordenar">Preordenar</a>
      <a href="https://instagram.com/sinfonia_cafe_cr" target="_blank" rel="noopener">Seguinos en Instagram</a>
    </div>
  </div>
</body>
</html>
